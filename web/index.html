<!DOCTYPE html>
<html lang="ja">
<head>
<!-- MeetForMe Web版 v0.39.15（node web/build.js で作成。直接は書き換えない） -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MeetForMe</title>
<style>
  :root {
    --teal: #0b6b6b; --teal-d: #084f4f; --tint: #e5f1f0; --bg: #f6f8f8; --card: #fff;
    --line: #dde5e4; --text: #1d2a2a; --sub: #5d6f6e; --warn: #b4521a; --warn-bg: #fdf1e7;
    --me: #0b6b6b; --ai: #8a5a00; --ai-bg: #fff4d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif; font-size: 14px; color: var(--text); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; color: var(--teal); font-weight: 700; white-space: nowrap; }
  header h1.logo { display: flex; align-items: center; gap: 9px; color: var(--teal-d); }
  .logo .mark { color: var(--teal); flex: none; }
  .logo .lw { display: inline-flex; align-items: baseline; letter-spacing: .01em; }
  .logo .lw b { font-weight: 900; color: var(--teal-d); }
  .logo .lw i { font-style: normal; font-weight: 500; font-size: .78em; margin: 0 .12em; color: var(--sub); }
  nav { display: flex; gap: 4px; }
  nav button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; font: inherit; color: var(--sub); cursor: pointer; position: relative; }
  nav button.on { background: var(--tint); color: var(--teal-d); font-weight: 700; }
  nav .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 11px; line-height: 16px; text-align: center; padding: 0 4px; }
  .bell { position: relative; border: 0; background: transparent; color: var(--teal-d); line-height: 0; cursor: pointer; padding: 8px 9px; border-radius: 8px; }
  .bell svg { display: block; }
  .bell:hover { background: var(--tint); }
  #bellN { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 11px; line-height: 16px; text-align: center; padding: 0 4px; }
  #bellN:empty { display: none; }
  #bellpanel { display: none; position: fixed; top: 58px; right: 16px; width: min(340px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 50; }
  #bellpanel.show { display: block; }
  #bellpanel .bh { padding: 10px 14px; font-weight: 700; color: var(--teal-d); border-bottom: 1px solid var(--line); }
  #bellpanel .bi { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; }
  #bellpanel .bi.new { background: var(--tint); }
  #bellpanel .bi .bt { display: block; color: var(--sub); font-size: 11.5px; }
  #bellpanel .be { padding: 18px 14px; color: var(--sub); font-size: 13px; }
  .who { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--tint); color: var(--teal-d); margin-left: 6px; }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  #status { display: none; padding: 8px 20px; background: var(--tint); color: var(--teal-d); border-bottom: 1px solid var(--line); }
  #status.show { display: flex; align-items: center; gap: 10px; }
  #status.err { background: var(--warn-bg); color: var(--warn); }
  #status button { margin-left: auto; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--teal); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #turn { display: none; padding: 9px 20px; border-bottom: 1px solid var(--line); align-items: center; gap: 12px; }
  #turn.show { display: flex; }
  #turn b { white-space: nowrap; padding: 2px 9px; border-radius: 12px; font-size: 12.5px; background: var(--tint); color: var(--teal-d); }
  #turn.urgent { background: var(--warn-bg); }
  #turn.urgent b { background: var(--warn); color: #fff; }
  #turn.wait { background: var(--card); color: var(--sub); }
  #turn button { margin-left: auto; }
  #turn.done { background: var(--teal); color: #fff; }
  #turn.done b { background: #fff; color: var(--teal-d); }
  #turn.done button { background: transparent; color: #fff; border-color: #fff; }
  /* 決定 */
  .stamp { display: inline-block; border: 3px solid #c0392b; color: #c0392b; font-weight: 800; letter-spacing: .2em; padding: 3px 12px 3px 16px; border-radius: 8px; transform: rotate(-6deg); font-size: 16px; }
  .stamp.big { font-size: 30px; padding: 6px 22px 6px 30px; border-width: 5px; animation: stampin .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stampin { from { transform: rotate(-6deg) scale(2.4); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
  .decidedcard { border: 2px solid var(--teal); background: linear-gradient(180deg, var(--tint), #fff 38%); position: relative; }
  .decidedcard .stamp { position: absolute; top: 14px; right: 18px; }
  .dlabel { color: var(--sub); font-size: 13px; }
  .dtitle { font-size: 24px; font-weight: 800; color: var(--teal-d); margin: 4px 0 6px; line-height: 1.4; }
  .dsum { line-height: 1.7; }
  .approvals { margin-top: 12px; }
  .apbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .apbar span { display: block; height: 100%; background: var(--teal); transition: width .4s; }
  .aplist { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 6px; }
  .ap { display: flex; align-items: center; gap: 8px; opacity: .55; }
  .ap.ok { opacity: 1; }
  .ap .av { width: 30px; height: 30px; }
  .ap .av i { top: 6px; width: 11px; height: 11px; margin-left: -5.5px; }
  .ap .av i::after { top: 13px; width: 24px; height: 20px; margin-left: -12px; }
  .apname { font-weight: 700; }
  .apmark { font-size: 12.5px; color: var(--sub); }
  .ap.ok .apmark { color: #23692b; font-weight: 700; }
  #overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(8, 40, 40, .55); align-items: center; justify-content: center; }
  #overlay.show { display: flex; }
  .decidedbox { position: relative; background: #fff; border-radius: 18px; padding: 34px 44px 30px; text-align: center; max-width: 560px; margin: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: boxin .35s ease-out both; }
  .decidedbox .dtitle { font-size: 28px; margin-top: 14px; }
  @keyframes boxin { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confetti i { position: absolute; top: -20px; width: 9px; height: 15px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .stamp.big, .decidedbox { animation: none; } }
  .progress { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .progress .pg { padding: 2px 9px; border-radius: 12px; font-size: 12px; border: 1px solid var(--line); color: var(--sub); background: #fff; }
  .progress .pg.ok { background: var(--tint); color: var(--teal-d); border-color: transparent; font-weight: 700; }
  .progress .btn { margin-left: auto; }
  details.fold > summary, details.more > summary { cursor: pointer; font-weight: 700; color: var(--teal-d); font-size: 15px; list-style-position: inside; }
  details.fold[open] > summary { margin-bottom: 10px; }
  details.more { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  details.more > summary { font-size: 13px; font-weight: 400; }
  #main { flex: 1; min-height: 0; display: flex; }
  #switch { position: relative; }
  #switch:empty { display: none; }
  .swbtn { display: flex; align-items: center; gap: 6px; max-width: 320px; font: inherit; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 6px 10px 6px 12px; border-radius: 20px; cursor: pointer; }
  .swbtn:hover { border-color: var(--teal); }
  .swlabel { color: var(--sub); font-size: 12.5px; white-space: nowrap; }
  .swname { font-weight: 700; color: var(--teal-d); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caret { color: var(--sub); font-size: 11px; }
  .swbtn .dot, .mitem .dot { min-width: 18px; height: 18px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 5px; font-weight: 700; }
  .swmenu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: 340px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.16); padding: 12px; }
  .swhead { font-size: 12.5px; color: var(--sub); margin: 0 4px 8px; }
  .mitem { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; text-align: left; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
  .mitem:hover { border-color: var(--teal); }
  .mitem.on { background: var(--tint); border-color: transparent; }
  .mitem .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swfoot { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  #view { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--teal-d); }
  .card h3 { font-size: 14px; margin: 14px 0 6px; }
  .hint { color: var(--sub); font-size: 12.5px; line-height: 1.6; }
  button.btn { font: inherit; border: 1px solid var(--teal); background: var(--teal); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  button.btn:hover { background: var(--teal-d); }
  button.btn.ghost { background: #fff; color: var(--teal-d); }
  button.btn.ghost:hover { background: var(--tint); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn.small { padding: 4px 10px; font-size: 12.5px; }
  textarea, input[type=text], input[type=password], input[type=number] { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  textarea:focus, input:focus { outline: 2px solid var(--tint); border-color: var(--teal); }
  label { display: block; font-weight: 700; margin: 14px 0 4px; }
  .row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; margin-top: 8px; }

  /* 個室 */
  .room { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); height: 100%; }
  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--card); }
  .chat-head { padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .msgs { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 84%; padding: 9px 13px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .bubble.assistant { background: var(--tint); align-self: flex-start; border-top-left-radius: 4px; }
  .bubble.user { background: var(--teal); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
  .reason1 { margin-top: 12px; line-height: 1.75; font-size: 15px; }
  .gap1 { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--tint); color: var(--teal-d); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .liveleft { color: var(--teal-d); }
  .mkspread { font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  details.rule { margin-top: 10px; }
  details.rule summary { cursor: pointer; color: var(--teal-d); font-size: 13px; }
  details.rule li { margin: 6px 0; line-height: 1.65; }
  .codebox { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; user-select: all; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px 2px; }
  .herofor { margin: 10px 0 0; padding: 10px 14px; border-left: 4px solid var(--teal); background: var(--tint); border-radius: 0 10px 10px 0; line-height: 1.7; }
  .quick .chip { font: inherit; cursor: pointer; border: 1.5px solid var(--teal); background: #fff; color: var(--teal-d); padding: 9px 14px; border-radius: 20px; text-align: left; line-height: 1.35; }
  .quick .chip:hover { background: var(--tint); }
  .quick .chip:disabled { opacity: .5; cursor: default; }
  .composer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .composer textarea { min-height: 44px; height: 44px; }
  .side { overflow: auto; padding: 16px; }

  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .tag.me { background: var(--tint); color: var(--me); }
  .tag.ai { background: var(--ai-bg); color: var(--ai); }
  .tag.mix { background: #e9e4fb; color: #4b34a3; }
  .tag.push { background: #e2f3e4; color: #23692b; }
  .tag.new { background: #fde8ef; color: #a3264f; }
  .fit { margin-top: 6px; font-size: 13px; line-height: 1.6; }
  .fit b { color: #9a6b00; font-weight: 700; white-space: nowrap; }
  .idea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .idea .ttl { font-weight: 700; }
  .parts { display: grid; grid-template-columns: 7.5em 1fr; gap: 3px 8px; margin-top: 6px; font-size: 13px; }
  .parts dt { color: var(--sub); }
  .parts dd { margin: 0; }
  .kv { margin: 4px 0; font-size: 13px; line-height: 1.6; }
  .kv b { color: var(--sub); font-weight: 400; }

  /* 会議室 */
  .members { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font-size: 13px; }
  .chip.ok { background: var(--tint); border-color: transparent; color: var(--teal-d); }
  .q { background: var(--warn-bg); border: 1px solid #f3d3b8; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .q p { margin: 0 0 8px; line-height: 1.6; }
  .rec { border: 2px solid var(--teal); }
  .rec .big { font-size: 18px; font-weight: 700; margin: 2px 0 8px; }
  .decided { background: var(--teal); color: #fff; border-color: var(--teal); }
  .decided h2 { color: #fff; }
  .evals { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 13px; }
  .ev { display: grid; grid-template-columns: 9em 11em 1fr; gap: 8px; }
  .r-s5, .r-s4 { color: #23692b; font-weight: 700; } .r-s3 { color: var(--sub); } .r-s2 { color: #9a6b00; } .r-s1 { color: #b3261e; font-weight: 700; }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .marks.rows { flex-direction: column; gap: 8px; }
  .mkrow { display: flex; gap: 10px; align-items: baseline; }
  .mkrow .mk { flex: none; }
  .mknote { color: var(--ink, inherit); font-size: 13.5px; line-height: 1.6; }
  .gap { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; line-height: 1.7; }
  .gap-h b { font-size: 16px; color: var(--teal-d); margin: 0 8px 0 2px; }
  .gapsub { color: var(--sub); font-size: 12.5px; margin-left: 6px; }
  .gap-l { display: block; margin-top: 6px; font-size: 12.5px; font-weight: 700; color: var(--sub); }
  .gap ul.plain { margin: 2px 0 0; }
  .mk { padding: 2px 9px; border-radius: 12px; font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); }
  .mk.s5, .mk.s4 { background: #e2f3e4; border-color: transparent; color: #23692b; }
  .mk.s2, .mk.s1 { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  .guessnote { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--ai-bg); color: var(--ai); }
  .call { border-top: 1px solid var(--line); padding: 8px 0; }
  .callrow { display: grid; grid-template-columns: 13em 10em 5em 1fr; gap: 8px; font-size: 13px; }
  .call details.more { margin-top: 6px; padding-top: 6px; }
  pre.prompt { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 12.5px; line-height: 1.6; background: var(--bg); border-radius: 8px; padding: 10px; max-height: 320px; overflow: auto; margin: 6px 0 0; }
  .feas { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--line); }
  .feas.ok { border-left-color: #2e8b3d; } .feas.partial { border-left-color: #d49a00; } .feas.hard { border-left-color: #c0392b; }
  .feashead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
  .fv { padding: 1px 9px; border-radius: 12px; font-size: 12.5px; font-weight: 700; color: #fff; background: #888; }
  .fv.ok { background: #2e8b3d; } .fv.partial { background: #b98300; } .fv.hard { background: #c0392b; }
  .feas a { color: var(--teal-d); }
  .pts { margin-top: 6px; font-weight: 700; color: var(--teal-d); }
  .score { float: right; font-size: 12.5px; color: var(--sub); }
  .dropped { opacity: .6; }
  .log { display: flex; flex-direction: column; gap: 14px; }
  .log .m { line-height: 1.65; }
  .log .m .sp { font-weight: 700; color: var(--teal-d); margin-right: 6px; }
  .log .m.system { color: var(--sub); font-size: 12.5px; text-align: center; border-top: 1px solid var(--line); padding-top: 8px; }
  .log .m.fac .sp { color: #4b34a3; }
  .card.live { border: 2px solid var(--teal); }
  .livedot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #c0392b; margin-right: 8px; animation: ld 1.1s ease-in-out infinite; }
  @keyframes ld { 50% { transform: scale(1.6); opacity: .45; } }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .step { padding: 4px 10px; border-radius: 14px; font-size: 12.5px; background: var(--bg); color: var(--sub); border: 1px solid var(--line); }
  .tplrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 2px; }
  .wdead { margin: 10px 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 14px; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: baseline; }
  .heroterm { font-size: 13.5px; color: var(--sub); line-height: 1.8; margin: 6px 0 0; }
  .heroterm b { color: var(--ink, inherit); margin-left: 4px; }
  input[type='datetime-local'] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .livetime { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin: -4px 0 12px; }
  .livetime b { color: var(--teal-d); font-variant-numeric: tabular-nums; }
  .step.done { background: var(--tint); color: var(--teal-d); border-color: transparent; }
  .step.now { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; }
  .livelog { max-height: 420px; overflow: auto; padding: 12px; background: var(--bg); border-radius: 10px; }
  .brow { display: flex; gap: 10px; align-items: flex-start; }
  .brow.mine { flex-direction: row-reverse; }
  .bcol { max-width: 78%; min-width: 0; }
  .brow.mine .bcol { display: flex; flex-direction: column; align-items: flex-end; }
  .bname { font-size: 12px; color: var(--sub); margin: 0 4px 3px; }
  .bub { background: #fff; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 9px 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .brow.mine .bub { background: var(--tint); border-color: transparent; border-radius: 14px 4px 14px 14px; }
  .brow.fac .bub { background: #f1eefc; border-color: transparent; }
  .brow.typing .bub { color: var(--sub); }
  .para { margin: 0; line-height: 1.7; }
  .para + .para { margin-top: .7em; }

  /* 人の形のアイコン（頭と肩を丸で描く） */
